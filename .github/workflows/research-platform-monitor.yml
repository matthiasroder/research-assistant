name: Research Platform Monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 Europe/Vienna during summer time, 07:00 during winter time.
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: research-platform-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/research_assistant/requirements.txt

      - name: Run research platform monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m research_platform.runner monitor-sources \
            --brief "Monitor configured research sources" \
            --source-file config/monitor-sources.yaml \
            --max-items-per-source 20

      - name: Commit monitor artifacts
        run: |
          git config user.name "research-platform-bot"
          git config user.email "research-platform-bot@users.noreply.github.com"
          git add runs knowledge/platform_state.json
          git diff --cached --quiet || git commit -m "Run research platform monitor"
          git push

