name: Research Platform Monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:30 UTC (05:30 Vienna in winter, 06:30 in summer).
    # GitHub may delay scheduled runs by minutes to hours.
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: research-platform-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: Run research platform monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The standing brief comes from the source file.
          python -m research_platform.runner monitor-sources \
            --source-file config/monitor-sources.yaml \
            --max-items-per-source 20

      - name: Prune runs older than 90 days
        run: |
          cutoff=$(date -u -d '90 days ago' +%Y-%m-%d)
          for dir in runs/*/; do
            [ -d "$dir" ] || continue
            day=$(basename "$dir" | cut -c1-10)
            if [[ "$day" < "$cutoff" ]]; then
              echo "Pruning $dir"
              rm -rf "$dir"
            fi
          done

      - name: Commit monitor artifacts
        run: |
          git config user.name "research-platform-bot"
          git config user.email "research-platform-bot@users.noreply.github.com"
          git add -A runs
          git add knowledge/platform_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Run research platform monitor"
            git pull --rebase origin main
            git push
          fi
