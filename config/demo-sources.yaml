# Public sources that are safe to use for smoke tests and demos.

sources:
  - id: example-website
    type: webpage
    name: Example Website
    url: https://example.com
    access:
      method: public

  - id: example-x-profile
    type: x_profile
    name: OpenAI on X
    url: https://x.com/openai
    access:
      method: browser_session
      store_full_text: false

