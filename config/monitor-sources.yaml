# Sources used by the scheduled GitHub Actions monitor.
#
# Edit this file to add the sources you want the platform to watch.

sources:
  - id: hacker-news-front-page
    type: rss
    name: Hacker News Front Page
    url: https://hnrss.org/frontpage
    access:
      method: public

  - id: openai-x-profile
    type: x_profile
    name: OpenAI on X
    url: https://x.com/openai
    access:
      method: browser_session
      store_full_text: false

